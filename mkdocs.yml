site_name: Dyno 🦖
site_description: A modern Python framework for DSGE and macroeconomic modeling
site_author: EconForge & Pablo Winant

plugins:
  - search
  - mkdocstrings

markdown_extensions:
  - markdown.extensions.admonition
  - markdown.extensions.attr_list
  - markdown.extensions.def_list
  - markdown.extensions.footnotes
  - markdown.extensions.md_in_html
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.snippets
  - pymdownx.highlight:
      use_pygments: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

theme:
  name: material
  features:
    - content.code.copy
    - content.tooltips
    - navigation.expand
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.top

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Overview: index.md
  - Getting Started:
      - Installation & Setup: getting_started/installation.md
      - Writing a Dyno Model: getting_started/dyno_quickstart.md
      - Solving a Dynare Model: getting_started/dynare_quickstart.md
  - Model Specification:
      - Language Syntax: model_specification/syntax.md
      - Blocks & Metadata: model_specification/metadata_blocks.md
  - DynSpec Engine:
      - Overview & Architecture: dynspec/index.md
      - Grammar & AST: dynspec/grammar_ast.md
      - Evaluation & AutoDiff: dynspec/analysis_autodiff.md
      - Recipes & Validation: dynspec/recipes_conformity.md
      - Function Compilation: dynspec/funcgen_compilation.md
      - LaTeX Export: dynspec/latex_export.md
  - Solvers & Theory:
      - Steady State: solvers/steady_state.md
      - First-Order Perturbation: solvers/perturbation.md
      - Deterministic & Perfect Foresight: solvers/deterministic.md
  - Analysis & Simulation:
      - Impulse Response Functions: analysis/irfs.md
      - Moments & Covariance: analysis/moments.md
      - Simulation: analysis/simulation.md
      - Automated Reports: analysis/reports.md
  - Tutorials:
      - Real Business Cycle (RBC): tutorials/rbc_model.md
      - Transition Dynamics: tutorials/transition_dynamics.md
      - Interactive Web GUI: tutorials/interactive_gui.md
  - API Reference:
      - Models: api/models.md
      - Solvers: api/solver.md
      - Simulation: api/simul.md
      - Reports: api/report.md
      - DynSpec: api/dynspec.md
      - Errors: api/errors.md