name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+*'
  workflow_dispatch:
    inputs:
      target:
        description: 'Publish target (pypi or testpypi)'
        required: true
        default: 'pypi'
        type: choice
        options:
          - pypi
          - testpypi

jobs:
  build-n-publish:
    name: Build and publish Python 🐍 distributions 📦
    runs-on: ubuntu-latest
    permissions:
      contents: write # for creating GitHub Releases
      id-token: write # mandatory for PyPI Trusted Publishing (OIDC)

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v6

    - name: Build distributions
      run: uv build --out-dir dist/

    # TestPyPI dispatch (if manually triggered for TestPyPI with an API token)
    - name: Publish to TestPyPI
      if: github.event.inputs.target == 'testpypi'
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://test.pypi.org/legacy/
        password: ${{ secrets.test_pypi_password || secrets.TEST_PYPI_API_TOKEN }}

    # Production PyPI: uses API token if secret is present
    - name: Publish to PyPI (Token)
      if: (github.event_name == 'push' || github.event.inputs.target == 'pypi') && (secrets.pypi_password != '' || secrets.PYPI_API_TOKEN != '')
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.pypi_password || secrets.PYPI_API_TOKEN }}

    # Production PyPI: uses Trusted Publishing (OIDC) if no secret is present
    - name: Publish to PyPI (Trusted Publishing)
      if: (github.event_name == 'push' || github.event.inputs.target == 'pypi') && secrets.pypi_password == '' && secrets.PYPI_API_TOKEN == ''
      uses: pypa/gh-action-pypi-publish@release/v1

    # Attach built assets to GitHub Release when triggered by a tag
    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
