[project]
site_name = "Dyno 🦖"
site_description = "A modern Python framework for DSGE and macroeconomic modeling"
site_author = "EconForge & Pablo Winant"
copyright = "Copyright &copy; 2026 EconForge"

extra_css = [
  "stylesheets/extra.css",
]

extra_javascript = [
  "javascripts/mathjax.js",
  "https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js",
]

nav = [
  { "Overview" = "index.md" },
  { "Getting Started" = [
      "getting_started/installation.md",
      "getting_started/dyno_quickstart.md",
      "getting_started/dynare_quickstart.md",
  ]},
  { "Model Specification" = [
      "model_specification/syntax.md",
      "model_specification/metadata_blocks.md",
      "model_specification/architecture.md",
  ]},
  { "Solvers & Theory" = [
      "solvers/steady_state.md",
      "solvers/perturbation.md",
      "solvers/deterministic.md",
  ]},
  { "Analysis & Simulation" = [
      "analysis/irfs.md",
      "analysis/moments.md",
      "analysis/simulation.md",
      "analysis/reports.md",
  ]},
  { "Subpackages & Roadmap" = [
      "subpackages/index.md",
      "subpackages/model_explorer.md",
      { "DynSpec (Specification Engine)" = [
          "dynspec/index.md",
          "dynspec/grammar_ast.md",
          "dynspec/analysis_autodiff.md",
          "dynspec/recipes_conformity.md",
          "dynspec/funcgen_compilation.md",
          "dynspec/latex_export.md",
      ]},
      { "Dynare in Python" = [
          "dynare/index.md",
      ]},
  ]},
  { "Dyno Lab (GUI)" = [
      "dyno_lab/index.md",
      "dyno_lab/interface.md",
      "dyno_lab/options_and_settings.md",
  ]},
  { "Tutorials" = [
      "tutorials/rbc_model.md",
      "tutorials/transition_dynamics.md",
      "tutorials/interactive_gui.md",
  ]},
  { "API Reference" = [
      "api/models.md",
      "api/solver.md",
      "api/simul.md",
      "api/report.md",
      "api/dynspec.md",
      "api/errors.md",
  ]},
]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "content.code.annotate",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]

[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.pymdownx.arithmatex]
generic = true

[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true

[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true

[project.markdown_extensions.pymdownx.tilde]
