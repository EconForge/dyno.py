[workspace]
authors = ["Pablo Winant <pablo.winant@gmail.com>","Ousema Bouaneni <ousema.bouaneni@polytechnique.edu>"]
description = "Macroeconomic model solver"
channels = ["https://prefix.dev/econforge","conda-forge"]

preview = ["pixi-build"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

# pyproject.toml is the single source of truth for the package name, version,
# Python floor (`requires-python`) and runtime dependencies: hatchling builds
# the wheel from it, and pixi-build-python reads it to build the conda package
# (so `[package]` declares neither a version nor run-dependencies). The copies
# of the runtime dependencies in `[dependencies]` and in the `min-deps` feature
# below are checked against it by `ci/check_deps.py` (`pixi run check-deps`).
[package]

[package.build]
backend = { name = "pixi-build-python", version = ">=0.4.0" }
build-number = 0

[package.build.config]
noarch = true
# Map `[project.dependencies]` from pyproject.toml to conda run dependencies.
ignore-pypi-mapping = false

[package.host-dependencies]
hatchling = "==1.26.3"

[pypi-dependencies]
dyno = { path = "." , editable = true}

[dependencies]
python = ">=3.12,<3.14"
rich = ">=13.0.0,<15"
interegular = ">=0.3.3,<0.4"
markdown-it-py = ">=3.0.0,<5"
mdit-py-plugins = ">=0.4.0,<1"
altair = ">=5.0.0,<7"
tempita = ">=0.6.0,<0.7"
pytest = ">=9.0.2,<10"
numpy = ">=1.26.0,<3"
scipy = ">=1.11.3,<2"
pandas = ">=2.1.1,<4"
typing_extensions = ">=4.6.0,<5"
black = ">=26.1.0,<27"
pathspec = ">=1.0.4,<2"
ripgrep = ">=15.1.0,<16"
lark = ">=1.1.7,<2"
pyyaml = ">=6.0.1,<7"
plotext = ">=5.3.2,<6"

[feature.dynare]
# dynare-preprocessor-pylib has no osx-arm64 build yet (econforge or conda-forge)
platforms = ["linux-64", "osx-64", "win-64"]

[feature.dynare.dependencies]
dynare-preprocessor-pylib = "0.0.1.dev0.*"

[feature.dynare-task.tasks]
dynare = "python -c \"from dyno.cli import dynare_cmd; dynare_cmd()\""

[feature.test.dependencies]
pytest = ">=9.0.2,<10"
coverage = ">=7.13.4,<8"
pytest-cov = ">=7.0.0,<8"

[feature.test.tasks]
check-deps = "python ci/check_deps.py"
test = "pytest --ignore=tests/dynare"
test-all = "pytest"
test-dynare = "pytest tests/dynare"
cov = "pytest --ignore=tests/dynare --cov=./ --cov-report=xml"

[feature.lint.dependencies]
mypy = ">=1.19.1,<2"
pandas-stubs = ">=3.0.0.260204,<4"
scipy-stubs = ">=1.17.0.2,<2"
types-mock = ">=5.2.0.20250924,<6"
types-pyyaml = ">=6.0.12.20250915,<7"
black = ">=26.1.0,<27"

[feature.lint.tasks]
typecheck = "mypy src --ignore-missing-imports"
black = "black src tests scratch"

[feature.gui.dependencies]
mock = ">=5.2.0,<6"
ipyvuetify = ">=1.11.3,<2"
solara = ">=1.57.1,<2"
solara-ui = ">=1.57.1,<2"
solara-server = ">=1.57.1,<2"
anywidget = ">=0.9.21,<0.10"

[feature.gui.tasks]
explorer = "solara run scripts/model_representation.py"

[feature.jupyter.dependencies]
jupyterlab = ">=4.5.4,<5"
ipykernel = ">=7.2.0,<8"
matplotlib = ">=3.10.8,<4"
notebook = ">=7.5.3,<8"
jupyterlab-dyno = ">=0.1.1,<0.2.0"

[feature.jupyter.tasks]
jlab = { cmd = "ipython kernel install --name $PIXI_ENVIRONMENT_NAME --user && jupyter lab", default-environment = "dev" }

[feature.specta.dependencies]
jupyterlite = ">=0.8.4,<0.9"
jupyterlite-pyodide-kernel = ">=0.8.6,<0.9"
specta = ">=0.5.2,<0.6"

[feature.docs.dependencies]
mkdocs = ">=1.6.1,<2"
mkdocstrings-python = ">=2.0.2,<3"
mkdocs-material = ">=9.7.1,<10"
pymdown-extensions = ">=10.21.1,<11"
python-markdown-math = ">=0.9,<0.10"
zensical = ">=0.0.52,<0.1"

[feature.docs.tasks]
docs = "zensical serve"
build-docs = "zensical build"

[feature.py312.dependencies]
python = ">=3.12.0,<3.13"

[feature.py313.dependencies]
python = ">=3.13.0,<3.14"

# Lowest versions allowed by pyproject.toml: the `min-deps` environment pins
# every runtime dependency to its floor (and Python to the oldest supported
# minor version), so that CI runs the test suite against the floors.
[feature.min-deps.dependencies]
python = "3.12.*"
altair = "==5.0.0"
interegular = "==0.3.3"
lark = "==1.1.7"
markdown-it-py = "==3.0.0"
mdit-py-plugins = "==0.4.0"
numpy = "==1.26.0"
pandas = "==2.1.1"
plotext = "==5.3.2"
pyyaml = "==6.0.1"
rich = "==13.0.0"
scipy = "==1.11.3"
tempita = "==0.6.0"
typing_extensions = "==4.6.0"

[feature.experimental]
# jaxlib is not packaged for win-64 on conda-forge
platforms = ["linux-64", "osx-64", "osx-arm64"]

[feature.experimental.dependencies]
sympy = ">=1.12,<2"
python-symengine = "*"
jax = "*"

[feature.dev-experimental]
# jaxlib is not packaged for win-64 on conda-forge
platforms = ["linux-64", "osx-64", "osx-arm64"]

[feature.dev-experimental.dependencies]
jax = "*"

#[feature.experimental.pypi-dependencies]
#jax = ">=0.4.38,<0.5"

[environments]
test = ["test"]
prod = ["jupyter"]
dev = ["test", "lint", "jupyter", "docs", "specta"]
dynare = ["dynare", "dynare-task"]
solara = ["gui", "dynare"]
dev-dynare = ["test", "lint", "jupyter", "docs", "dynare", "specta"]
dev-experimental = ["test", "lint", "jupyter", "docs", "experimental", "dev-experimental"]
py312 = ["test", "lint", "py312"]
py313 = ["test", "lint", "py313"]
min-deps = ["test", "min-deps"]
