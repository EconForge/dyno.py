[project]
name = "dyno"
version = "0.1.13"
description = "Macroeconomic model solver"
readme = "README.md"
authors = [
    { name = "Pablo Winant", email = "pablo.winant@gmail.com" },
    { name = "Ousema Bouaneni", email = "ousema.bouaneni@polytechnique.edu" },
]
requires-python = ">= 3.12,<3.14"
license = "BSD-3-Clause"
classifiers = [
    "Operating System :: OS Independent",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "altair>=5.0.0,<7",
    "interegular>=0.3.3,<0.4",
    "lark>=1.1.7,<2",
    "markdown-it-py>=3.0.0,<5",
    "mdit-py-plugins>=0.4.0,<1",
    "numpy>=1.26.0,<3",
    "pandas>=2.1.1,<4",
    "plotext>=5.3.2,<6",
    "pyyaml>=6.0,<7",
    "rich>=13.0.0,<15",
    "scipy>=1.11.3,<2",
    "tempita>=0.6.0,<0.7",
    "typing_extensions>=4.6.0,<5",
]

[project.optional-dependencies]
experimental = ["sympy>=1.12,<2"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/dyno"]

[tool.hatch.build.targets.wheel.force-include]
"examples" = "dyno/examples"

[tool.hatch.build.targets.sdist]
only-include = ["src", "examples", "tests", "README.md", "LICENSE", "pyproject.toml"]
